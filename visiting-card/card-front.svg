<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap');
      .cf-title { font-family: 'Cinzel', serif; font-weight: 900; fill: #ffffff; }
      .cf-gold { font-family: 'Cinzel', serif; font-weight: 700; fill: #cda75f; letter-spacing: 3px; }
      .cf-tag { font-family: 'Outfit', sans-serif; font-weight: 600; fill: #f3e6c8; letter-spacing: 1.5px; }
      .cf-sub { font-family: 'Outfit', sans-serif; fill: #e0eedb; }
      .cf-bold { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #0e3820; text-anchor: middle; }
      .cf-qr-sub { font-family: 'Outfit', sans-serif; font-weight: 500; fill: #5e6b60; text-anchor: middle; }
    </style>
    <filter id="cf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Premium Emerald Background -->
  <rect width="1050" height="600" fill="#0e3820"/>

  <!-- Gold Border Frame -->
  <rect x="22" y="22" width="1006" height="556" rx="16" fill="none" stroke="#cda75f" stroke-width="3"/>
  <rect x="30" y="30" width="990" height="540" rx="12" fill="none" stroke="#cda75f" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Left Side: Branding & Info -->
  <g transform="translate(70, 70)">
    <!-- Emblem -->
    <circle cx="42" cy="42" r="38" fill="none" stroke="#cda75f" stroke-width="2.5"/>
    <circle cx="42" cy="42" r="34" fill="none" stroke="#cda75f" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="42" y="50" font-family="'Cinzel', serif" font-weight="900" font-size="22" fill="#cda75f" text-anchor="middle">BSD</text>

    <!-- Brand Name -->
    <text x="100" y="42" class="cf-title" font-size="34" letter-spacing="1.5">BALAJI CHILUKUR</text>
    <text x="100" y="72" class="cf-gold" font-size="18">FAMILY DHABA</text>
    
    <line x1="0" y1="120" x2="520" y2="120" stroke="#cda75f" stroke-width="1.5"/>
    <polygon points="260,116 265,120 260,124 255,120" fill="#cda75f"/>

    <text x="0" y="160" class="cf-tag" font-size="15">PURE VEGETARIAN · MADE WITH HEART</text>

    <!-- Menu Features -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="510" height="180" rx="12" fill="#082414" stroke="#cda75f" stroke-width="1" stroke-opacity="0.4"/>
      
      <circle cx="26" cy="35" r="5" fill="#cda75f"/>
      <text x="42" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="17" fill="#ffffff">204 Pure Veg Delicacies · 24 Categories</text>
      
      <circle cx="26" cy="75" r="5" fill="#cda75f"/>
      <text x="42" y="80" class="cf-sub" font-size="15">North Indian Curries · Tandoori Roti · Fragrant Biryanis</text>

      <circle cx="26" cy="115" r="5" fill="#cda75f"/>
      <text x="42" y="120" class="cf-sub" font-size="15">Comfort Starters · Sizzling Chinese · Thalis &amp; Meals</text>

      <circle cx="26" cy="152" r="5" fill="#cda75f"/>
      <text x="42" y="157" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#cda75f">Moinabad &amp; Pragathi Nagar · Open Daily 11 AM – 11 PM</text>
    </g>

    <!-- Bottom Veg Mark -->
    <rect x="0" y="420" width="20" height="20" fill="none" stroke="#2ecc71" stroke-width="2" rx="3"/>
    <circle cx="10" cy="430" r="5" fill="#2ecc71"/>
    <text x="32" y="435" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#2ecc71">100% PURE VEGETARIAN</text>
  </g>

